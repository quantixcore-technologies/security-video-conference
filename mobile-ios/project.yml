# XcodeGen spec — .xcodeproj shu fayldan generatsiya qilinadi (macOS/CI da).
#   brew install xcodegen && cd mobile-ios && xcodegen generate
# Sabab: pbxproj qo'lda yozilsa mo'rt bo'ladi; spec — o'qiladigan va git-friendly.
name: SVC
options:
  bundleIdPrefix: uz.svc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# 2-bosqich (LiveKit video) uchun quyidagini yoqing va targets.SVC.dependencies'ga
# `- package: LiveKit / product: LiveKit` qo'shing. Hozir ulanmagan: server tomonda
# media oqimi qurilmalararo o'tmaydi (NAT/tunnel) — Cloud yoki statik IP kutilmoqda.
# packages:
#   LiveKit:
#     url: https://github.com/livekit/client-sdk-swift
#     from: 2.0.0

targets:
  SVC:
    type: application
    platform: iOS
    sources:
      - path: SVC
    info:
      path: SVC/Info.plist
      properties:
        CFBundleDisplayName: SVC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Ruxsatlar — foydalanuvchiga ko'rinadigan izohlar (App Store talabi)
        NSCameraUsageDescription: "Video-qo'ng'iroqda qatnashish uchun kamera kerak."
        NSMicrophoneUsageDescription: "Video-qo'ng'iroqda gapirish uchun mikrofon kerak."
        NSLocationWhenInUseUsageDescription: "Xavfsizlik siyosati: majlisga ulanishda joylashuv qayd etiladi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.svc
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"   # faqat iPhone
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
