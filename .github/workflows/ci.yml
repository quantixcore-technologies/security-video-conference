name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test · Format · Credo · Sobelow
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps & build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix sobelow --exit Medium --root apps/svc_web -i Config.CSRF
      - run: mix test

  # Tauri-клиент целиком: Rust-shell (детектор рекордеров S36/D-018) + TS-фронтенд
  # (отправка `capture_events`, реакция warn/eject). Без этой job'ы ни то, ни другое
  # не проверялось нигде, кроме машины разработчика.
  desktop:
    name: Desktop · Rust + TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - uses: actions/checkout@v4

      # Крейт `tauri` линкуется с webkit2gtk/soup — без них не собирается даже `cargo test --lib`.
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --check
      - run: cargo clippy --lib --all-targets -- -D warnings
      - run: cargo test --lib

      # Фронтенд Tauri: именно здесь живёт отправка `recorder_detected` и
      # обработка reaction (warn → баннер, eject → выход из комнаты).
      - uses: oven-sh/setup-bun@v2

      - name: Зависимости фронтенда
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: TypeScript
        working-directory: desktop
        run: bunx tsc --noEmit

      - name: Сборка фронтенда
        working-directory: desktop
        run: bun run build

  # Android-клиент — основной боевой клиент (APK раздаётся с лендинга, OTA D-017),
  # но до сих пор не проверялся в CI вообще: баг с незеркальным своим видео и
  # незаявленный ACCESS_COARSE_LOCATION дожили до продакшена именно поэтому.
  android:
    name: Android · Kotlin (lint · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 требует JDK 17+; проект собирается под jvmTarget 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Ставит cmdline-tools и принимает лицензии — дальше AGP сам дотянет
      # platform-35 / build-tools по compileSdk из build.gradle.kts.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Android Lint держим как обязательный гейт: именно он поймал
      # CoarseFineLocation (Android 12+ даёт выбор «приблизительно», и запрос
      # только FINE оставлял такого пользователя вообще без координат — E7).
      - run: ./gradlew lintDebug

      # Собираем именно debug: release-keystore в проекте нет, assembleRelease
      # даст неподписанный APK, который не встанет поверх установленного (D-017).
      - run: ./gradlew assembleDebug
