# Локальный LiveKit для разработки (E1, D-003).
# Запуск: docker compose -f deploy/livekit/docker-compose.yml up -d
# Ключи (devkey/devsecret) совпадают с config/dev.exs Svc.LiveKit.

services:
  redis:
    image: redis:7-alpine
    container_name: svc-livekit-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  livekit:
    image: livekit/livekit-server:latest
    container_name: svc-livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"        # signaling (WS/HTTP)
      - "7881:7881"        # RTC over TCP
      - "50000-50050:50000-50050/udp"  # RTC over UDP (диапазон сужен для dev)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis
